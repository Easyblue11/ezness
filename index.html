<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- First paint must already be in the saved theme: the app shell below is
         the dark default, and React only corrects it after mounting. Without
         this inline boot step a light theme flashes dark on every Ctrl+R. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ezness.theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.dataset.theme = saved;
            return;
          }
        } catch (error) {
          /* storage blocked: fall through to the OS preference */
        }
        try {
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.documentElement.dataset.theme = 'light';
          }
        } catch (error) {
          /* keep the dark default */
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Local-only shell: no remote scripts. 'unsafe-inline' is required by Vite's dev
         preamble and by React's inline styles; there is no remote content to inject into. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' ws://localhost:5173 ws://127.0.0.1:5173 http://localhost:5173 http://127.0.0.1:5173" />
    <title>EZNess</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
